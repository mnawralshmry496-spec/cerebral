<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مخي — مهامي ومواعيدي</title>
<style>
:root{color-scheme:light dark;--blue:#2563eb;--blue2:#1d4ed8;--pale:light-dark(#eff6ff,#172b4b);--bg:light-dark(#f3f7ff,#0b1220);--surface:light-dark(#ffffff,#131d2e);--surface2:light-dark(#f8fbff,#19263a);--text:light-dark(#172033,#f0f5ff);--muted:light-dark(#68758b,#a4b2c8);--border:light-dark(#dbe6f5,#2b3a52);--green:light-dark(#15803d,#4ade80);--red:light-dark(#b91c1c,#f87171)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}.app{min-height:100vh;background:var(--bg)}.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:18px max(20px,calc((100% - 1160px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#60a5fa,#1d4ed8);display:grid;place-items:center;color:white;font-size:24px;box-shadow:0 7px 18px #2563eb30}.brand h1{font-size:22px;margin:0 0 4px;letter-spacing:.2px}.brand p{font-size:12px;color:var(--muted);margin:0}.date-label{font-size:17px;font-weight:bold;color:#2563eb;text-align:left;background:var(--pale);border:1px solid #bfdbfe;padding:12px 16px;border-radius:14px;line-height:1.6;box-shadow:0 5px 16px #2563eb10}.layout{max-width:1160px;margin:auto;padding:30px 20px 50px}.welcome{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px}.welcome h2{font-size:28px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0;font-size:14px}.primary{background:var(--blue);color:white;border:0;border-radius:11px;padding:12px 17px;font-weight:bold;cursor:pointer;font-family:inherit;transition:.15s}.primary:hover{background:var(--blue2);transform:translateY(-1px)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;display:flex;align-items:center;gap:13px;box-shadow:0 5px 18px #163b7410}.stat-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--pale);color:#1d4ed8;font-size:20px}.stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.stat strong{font-size:24px}.content{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,1fr);gap:20px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:21px;min-width:0;box-shadow:0 8px 26px #163b740c}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.panel-head h3{font-size:18px;margin:0}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid var(--border);background:var(--surface2);color:var(--muted);padding:7px 10px;border-radius:9px;cursor:pointer;font:inherit;font-size:12px}.filter.active{background:var(--pale);border-color:#93c5fd;color:#1d4ed8;font-weight:bold}.task-list{display:flex;flex-direction:column;gap:11px}.task{border:1px solid var(--border);background:var(--surface2);border-radius:14px;padding:15px;display:flex;align-items:flex-start;gap:12px;transition:border-color .15s,transform .15s}.task:hover,.appointment:hover{border-color:#93b4ed;transform:translateY(-1px)}.task.done .task-title{text-decoration:line-through;color:var(--muted)}.check{appearance:none;flex:0 0 20px;width:20px;height:20px;border:2px solid #9aabc3;border-radius:6px;margin:2px 0 0;cursor:pointer}.check:checked{background:var(--blue);border-color:var(--blue)}.check:checked:after{content:'✓';display:block;color:white;font-size:14px;text-align:center;line-height:16px}.task-main{flex:1;min-width:0}.task-title{font-weight:bold;font-size:14px;overflow-wrap:anywhere;line-height:1.7}.task-note{font-size:12px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere;line-height:1.7}.task-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:11px}.pill{font-size:12px;padding:6px 9px;border-radius:8px;background:var(--pale);color:#1d4ed8;display:inline-flex;align-items:center;gap:4px}.pill.high{background:light-dark(#fff1f2,#3a202a);color:var(--red)}.pill.low{background:light-dark(#f0fdf4,#163324);color:var(--green)}.delete{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:19px;padding:0 3px}.delete:hover{color:var(--red)}.empty{text-align:center;padding:35px 10px;color:var(--muted);font-size:13px;line-height:1.9}.empty span{font-size:30px;display:block;margin-bottom:10px}.appointments{display:flex;flex-direction:column;gap:11px}.appointment{display:flex;gap:12px;padding:14px;border:1px solid var(--border);border-radius:14px;background:var(--surface2);transition:border-color .15s,transform .15s}.appointment.done{opacity:.8}.appointment.done .appt-title{text-decoration:line-through;color:var(--muted)}.calendar-icon{width:54px;height:58px;flex:0 0 54px;border-radius:12px;background:linear-gradient(160deg,#eff6ff,#dbeafe);border:1px solid #bfdbfe;color:#1d4ed8;text-align:center;display:flex;flex-direction:column;justify-content:center;box-shadow:0 4px 10px #2563eb12}.calendar-icon b{font-size:22px;line-height:1.25}.calendar-icon small{font-size:11px;font-weight:bold}.appt-title{font-weight:bold;font-size:14px;margin:3px 0 7px;line-height:1.6}.appt-time{color:var(--muted);font-size:12px;line-height:1.8}.appt-actions{display:flex;align-items:flex-start;gap:5px}.appt-check{margin-top:3px}.appt-status{font-size:11px;padding:4px 7px;border-radius:7px;background:light-dark(#fff7ed,#3a2a1a);color:light-dark(#c2410c,#fdba74);display:inline-block;margin-top:8px}.appointment.done .appt-status{background:light-dark(#f0fdf4,#163324);color:var(--green)}.quick-add{width:100%;margin-top:15px;background:transparent;border:1px dashed #93b4ed;color:var(--blue);padding:12px;border-radius:12px;cursor:pointer;font:inherit;font-size:13px;transition:background .15s}.quick-add:hover{background:var(--pale)}.modal-backdrop{position:fixed;inset:0;background:#061127a8;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-backdrop.show{display:flex}.modal{width:min(100%,500px);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:0 25px 80px #0004;max-height:90vh;overflow:auto}.modal h3{margin:0 0 20px;font-size:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:10px;padding:11px;font:inherit;font-size:13px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #3b82f620}.modal-actions{display:flex;gap:10px;margin-top:20px}.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:11px;padding:11px 16px;cursor:pointer;font:inherit}.toast{position:fixed;bottom:20px;left:20px;background:#123b78;color:white;padding:12px 18px;border-radius:11px;box-shadow:0 10px 30px #0002;display:none;z-index:20;font-size:13px}.toast.show{display:block}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.content{grid-template-columns:1fr}.welcome h2{font-size:23px}}@media(max-width:480px){.topbar{padding:14px 16px;align-items:flex-start}.layout{padding:22px 14px 35px}.welcome{align-items:flex-start;flex-direction:column}.stats{gap:9px}.stat{padding:13px;gap:9px}.stat-icon{width:35px;height:35px}.stat strong{font-size:21px}.panel{padding:15px}.panel-head{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.date-label{font-size:13px;padding:9px 11px;text-align:right}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="logo">✦</div><div><h1>مخي</h1><p>رتّب يومك، وخلّ بالك مرتاح</p></div></div><div class="date-label" id="todayLabel"></div></header>
<main class="layout">
<section class="welcome"><div><h2 id="greeting">أهلاً بيك 👋</h2><p>خطوة صغيرة اليوم، إنجاز أكبر باچر.</p></div><button class="primary" id="addTaskTop">＋ إضافة مهمة</button></section>
<section class="stats"><div class="stat"><div class="stat-icon">☑</div><div><small>كل المهام</small><strong id="totalCount">0</strong></div></div><div class="stat"><div class="stat-icon">◷</div><div><small>قيد الإنجاز</small><strong id="pendingCount">0</strong></div></div><div class="stat"><div class="stat-icon">✓</div><div><small>مكتملة</small><strong id="doneCount">0</strong></div></div><div class="stat"><div class="stat-icon">▦</div><div><small>مواعيد قادمة</small><strong id="apptCount">0</strong></div></div></section>
<section class="content"><div class="panel"><div class="panel-head"><h3>مهامي</h3><div class="filters"><button class="filter active" data-filter="all">الكل</button><button class="filter" data-filter="pending">غير مكتملة</button><button class="filter" data-filter="done">مكتملة</button></div></div><div class="task-list" id="taskList"></div><button class="quick-add" id="addTaskBottom">＋ أضف مهمة جديدة</button></div>
<div class="panel"><div class="panel-head"><h3>مواعيدي</h3><button class="filter" id="addApptTop">＋ موعد</button></div><div class="filters appt-filters"><button class="filter active" data-appt-filter="all">الكل</button><button class="filter" data-appt-filter="pending">غير مكتملة</button><button class="filter" data-appt-filter="done">مكتملة</button></div><div class="appointments" id="appointmentList"></div><button class="quick-add" id="addApptBottom">＋ أضف موعد جديد</button></div></section>
</main></div>
<div class="modal-backdrop" id="modalBackdrop"><section class="modal"><h3 id="modalTitle">إضافة مهمة</h3><form id="entryForm"><div class="form-grid"><div class="field full"><label for="entryTitle">العنوان *</label><input id="entryTitle" required maxlength="100" placeholder="مثلاً: أدرس الإنكليزي"></div><div class="field"><label for="entryType">النوع</label><select id="entryType"><option value="task">مهمة</option><option value="appointment">موعد</option></select></div><div class="field"><label for="entryDate">التاريخ *</label><input id="entryDate" type="date" required></div><div class="field" id="timeField"><label for="entryTime">الوقت</label><input id="entryTime" type="time"></div><div class="field" id="priorityField"><label for="entryPriority">الأولوية</label><select id="entryPriority"><option value="normal">عادية</option><option value="high">عالية</option><option value="low">منخفضة</option></select></div><div class="field full"><label for="entryNote">ملاحظات (اختياري)</label><textarea id="entryNote" rows="3" maxlength="300" placeholder="تفاصيل إضافية..."></textarea></div></div><div class="modal-actions"><button class="primary" type="submit">حفظ</button><button class="secondary" type="button" id="cancelModal">إلغاء</button></div></form></section></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);let entries=[];let activeFilter='all';let activeApptFilter='all';let mode='task';
try{entries=JSON.parse(localStorage.getItem('munazzim_entries_v1')||'[]')}catch(e){entries=[]}
const today=new Date();const localDate=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};const todayISO=localDate(today);
$('todayLabel').textContent=today.toLocaleDateString('ar-IQ',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('greeting').textContent=(today.getHours()<12?'صباح الخير 👋':today.getHours()<18?'نهارك سعيد 👋':'مساء الخير 👋');$('entryDate').value=todayISO;
function save(){try{localStorage.setItem('munazzim_entries_v1',JSON.stringify(entries))}catch(e){}render()}
function formatDate(s){if(!s)return 'بلا تاريخ';const d=new Date(s+'T12:00:00');return d.toLocaleDateString('ar-IQ',{day:'numeric',month:'short'})}
function render(){const tasks=entries.filter(e=>e.type==='task');const appts=entries.filter(e=>e.type==='appointment').sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));$('totalCount').textContent=tasks.length;$('pendingCount').textContent=tasks.filter(e=>!e.done).length;$('doneCount').textContent=tasks.filter(e=>e.done).length;$('apptCount').textContent=appts.filter(e=>!e.done&&e.date>=todayISO).length;
const visible=tasks.filter(e=>activeFilter==='all'||(activeFilter==='done'?e.done:!e.done)).sort((a,b)=>(a.done-b.done)||((a.date||'').localeCompare(b.date||'')));$('taskList').innerHTML=visible.length?visible.map(e=>`<article class="task ${e.done?'done':''}"><input class="check" type="checkbox" aria-label="إكمال المهمة" data-check="${e.id}" ${e.done?'checked':''}><div class="task-main"><div class="task-title">${esc(e.title)}</div>${e.note?`<div class="task-note">${esc(e.note)}</div>`:''}<div class="task-meta"><span class="pill">📅 ${formatDate(e.date)}</span>${e.priority==='high'?'<span class="pill high">أولوية عالية</span>':e.priority==='low'?'<span class="pill low">أولوية منخفضة</span>':''}</div></div><button class="delete" title="حذف" aria-label="حذف المهمة" data-delete="${e.id}">×</button></article>`).join(''):'<div class="empty"><span>🗒️</span>ما عندك مهام هنا حالياً.<br>أضف مهمة حتى تبدأ ترتّب يومك.</div>';
const visibleAppts=appts.filter(e=>activeApptFilter==='all'||(activeApptFilter==='done'?e.done:!e.done));$('appointmentList').innerHTML=visibleAppts.length?visibleAppts.map(e=>{const day=new Date(e.date+'T12:00:00').toLocaleDateString('ar-IQ',{day:'numeric'});const month=new Date(e.date+'T12:00:00').toLocaleDateString('ar-IQ',{month:'short'});return `<article class="appointment ${e.done?'done':''}"><input class="check appt-check" type="checkbox" aria-label="إكمال الموعد" data-check="${e.id}" ${e.done?'checked':''}><div class="calendar-icon"><b>${day}</b><small>${month}</small></div><div class="task-main"><div class="appt-title">${esc(e.title)}</div><div class="appt-time">${e.time?'🕒 '+e.time+' · ':''}📅 ${formatDate(e.date)}</div>${e.note?`<div class="task-note">${esc(e.note)}</div>`:''}<span class="appt-status">${e.done?'✓ مكتمل':e.date<todayISO?'متأخر · غير مكتمل':'قيد الإنجاز'}</span></div><button class="delete" title="حذف الموعد" aria-label="حذف الموعد" data-delete="${e.id}">×</button></article>`}).join(''):'<div class="empty"><span>📅</span>ماكو مواعيد بهذا التصنيف.<br>أضف موعدك الجاي هنا.</div>';
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openModal(type){mode=type;$('modalTitle').textContent=type==='task'?'إضافة مهمة جديدة':'إضافة موعد جديد';$('entryType').value=type;$('entryDate').value=todayISO;$('entryTitle').value='';$('entryTime').value='';$('entryNote').value='';$('entryPriority').value='normal';$('priorityField').style.display=type==='task'?'flex':'none';$('timeField').style.display='flex';$('modalBackdrop').classList.add('show');setTimeout(()=>$('entryTitle').focus(),30)}
function closeModal(){$('modalBackdrop').classList.remove('show')}
$('addTaskTop').onclick=()=>openModal('task');$('addTaskBottom').onclick=()=>openModal('task');$('addApptTop').onclick=()=>openModal('appointment');$('addApptBottom').onclick=()=>openModal('appointment');$('cancelModal').onclick=closeModal;$('entryType').onchange=e=>{mode=e.target.value;$('modalTitle').textContent=mode==='task'?'إضافة مهمة جديدة':'إضافة موعد جديد';$('priorityField').style.display=mode==='task'?'flex':'none'};$('modalBackdrop').onclick=e=>{if(e.target===$('modalBackdrop'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('entryForm').onsubmit=e=>{e.preventDefault();const entry={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),type:$('entryType').value,title:$('entryTitle').value.trim(),date:$('entryDate').value,time:$('entryTime').value,note:$('entryNote').value.trim(),priority:$('entryPriority').value,done:false};if(!entry.title)return;entries.push(entry);save();closeModal();showToast(entry.type==='task'?'تمت إضافة المهمة':'تمت إضافة الموعد')};
document.addEventListener('click',e=>{const check=e.target.closest('[data-check]');if(check){const item=entries.find(x=>x.id===check.dataset.check);if(item){item.done=check.checked;save()}return}const del=e.target.closest('[data-delete]');if(del){entries=entries.filter(x=>x.id!==del.dataset.delete);save();showToast('تم الحذف');return}const filter=e.target.closest('[data-filter]');if(filter){activeFilter=filter.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===activeFilter));render();return}const apptFilter=e.target.closest('[data-appt-filter]');if(apptFilter){activeApptFilter=apptFilter.dataset.apptFilter;document.querySelectorAll('[data-appt-filter]').forEach(b=>b.classList.toggle('active',b.dataset.apptFilter===activeApptFilter));render()}});
function formatTime(value){if(!value)return '';const [hours,minutes]=value.split(':').map(Number);const period=hours>=12?'م':'ص';const hour12=hours%12||12;return `${hour12}:${String(minutes).padStart(2,'0')} ${period}`}let toastTimer;function showToast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2200)}render();const renderWithTaskTimes=render;render=function(){renderWithTaskTimes();document.querySelectorAll('#taskList .task').forEach(card=>{const check=card.querySelector('[data-check]');const item=entries.find(x=>x.id===check?.dataset.check);if(item?.time){const meta=card.querySelector('.task-meta');if(meta){const pill=document.createElement('span');pill.className='pill';pill.textContent='🕒 '+formatTime(item.time);meta.appendChild(pill)}}})};render();
</script></body></html>
